## This is the configuration file of the TDCRPy code

[Inputs]
## QUENCHING
# Number of bins to discretize the linear energy space for quenching calculation
# to achieve a relative standard uncertainty below 1e-4 on the estimated quenched energy: nE_electron = nE_alpha = 10000
# to achieve a relative standard uncertainty below 1e-3 on the estimated quenched energy: nE_electron = nE_alpha = 1000
nE_electron = 1000
nE_alpha = 1000
# stopping power model below 20 keV. could be two types the default tan_xia
# or other models: the joy_luo, marchal, ashley, kossert_graucarles, rao_reddy
sp_model = tan_xia
# Chou quenching parameter to account bimolecular quenching processes (in cm2/MeV2).
chou_param = 0

## PROPERTIES OF THE SCINTILLATOR
# Select a specific LS cocktail, possible choices:
# Ultima Gold
# Ultima Gold XR
# Ultima Gold AB
# Ultima Gold LLT
# Insta-Gel Plus
# Hionic-Fluor
# ProSafe+
# ProSafe HC+
# ProSafe TS+
# ProSafe LT+
# Water
# Toluene
# Pseudocumene
# Carbo-Sorb E
# Pico-Fluor 40
# Pico-Fluor Plus
# Permafluor E+
# Carbo-Sorb/Permafluor (1:1)
# PXE
# Or use default value entering False
ls_cocktail = Ultima Gold
## Type of solvant (HCl, HNO3, NaOH or Water)
solvantType = Water
## Solvent concentration in mol/L (0 for pure Water)
solvantConc = 0.0
# Aqueous fraction of the scintillator (0 = pure cocktail)
fAq = 0.0
# density of the scintillator — auto-computed from ls_cocktail + fAq
density = 0.980000
# mean charge number of the scintillator — auto-computed
Z = 3.251556
# mean mass number of the scintillator — auto-computed
A = 5.944938
# atomic probability — auto-computed from ls_cocktail + fAq
pH = 0.569971
pC = 0.390337
pN = 0.000933
pO = 0.035279
pP = 0.002551
pS = 0.000463
pNa = 0.000465
pCl = 0.000000
## PROMPT + DELAYED (TTA) FLUORESCENCE
# A coincidence window only collects the light emitted within it of the
# trigger, and scintillation light is not instantaneous: it has a fast
# (prompt) and a slow (delayed) component. The delayed one is triplet-triplet
# annihilation, which is bimolecular and so scales with the local dE/dx rather
# than with total deposited energy -- it cannot be absorbed into kB or L.
# OFF by default: turning it on changes every light yield, hence every
# efficiency, and eta/tau_delayed are fitted quantities, not measured ones.
# R. Coulon, "TDCR Measurements -- Lecture Notes", ch. 3.
delayedFluorescence = False
# Prompt-fluorescence decay time (ns). A measured constant of the cocktail,
# never fitted -- under a light yield refitted per window it is
# unidentifiable. 3.0 ns is the reference's worked-example value, pending a
# TCSPC bench measurement.
tau_prompt = 3.0
# Delayed-fluorescence window-capture time constant (ns) and delayed-light
# amplitude (dimensionless fraction of the Psi reservoir). These describe the
# scintillator, not the decay, and modifyLScocktail() re-derives them when the
# cocktail changes. Fitted per source over W = 50 ns - 1 us:
#   Ultima Gold family   tau_delayed =  85 ns   eta_delayed = 0.03
#   neat toluene         tau_delayed = 138 ns   eta_delayed = 0.05
tau_delayed = 85.0
eta_delayed = 0.03
# TTA kinetics behind the annihilation-saturation stopping power
# S_a = 4 W_ion A_c k_q / (3 gamma) = 1666.7 keV/cm. Literature
# order-of-magnitude values, not measurements; A_c is the softest. A fitted
# eta is conditional on these and is not transferable to another choice.
tta_kq = 5e6
tta_gamma = 1e-11
tta_Ac = 1e-13

# properties on reverse micelles
# Apply the reverse-micelle correction unconditionally. False does NOT mean
# "never": see micCorrAuto below.
micCorr = False
# Let the correction switch itself on for the nuclides that need it. When True
# (the default since v2.20.29) and fAq > 0, TDCRPy applies the correction to an
# electron-capture nuclide even with micCorr = False, and warns once per
# nuclide that it has done so. The reason is that confinement inside the water
# droplets costs about 5 % of the light of an Auger cascade and is NOT absorbed
# by the fitted free parameter L, unlike the (1 - fAq) bulk dilution -- so
# leaving it off biases the efficiency of Fe-55 or Cr-51 by several tenths of a
# percent while a pure beta emitter is unaffected. With fAq = 0 there are no
# droplets and this does nothing. See notebooks/physics/micelleCheck.ipynb.
micCorrAuto = True
# Confinement bias, in PER CENT of the light, above which a nuclide counts as
# needing the correction. Compared against the MEASURED value in
# Micelle/micelleBias.csv, which notebooks/physics/micelleCatalogue.py
# produced for the whole catalogue: Ar-37 12.36 %, Ca-41 10.36 %,
# Fe-55 5.19 %, Cr-51 4.81 %, Sr-82 1.01 %, H-3 0.44 %, C-14 0.0071 %.
# At the 0.01 % default 83 of the 225 screened nuclides activate when
# fAq > 0; 0.05 % keeps 45, 0.1 % keeps 29, and 1 % keeps only the nine
# strong Auger emitters. The table is a screening at fAq = 0.10 with 4 nm
# droplets, and a larger aqueous fraction raises the bias, so the default sits
# an order of magnitude below the level at which anyone would care.
micCorrBiasThreshold = 0.01
# Fallback only, for a nuclide absent from the bias table: the
# electron-capture probability per decay, from
# TDCR_model_lib.ec_branch_probability(). This was the gate until v2.20.31,
# when the catalogue screening showed it is the weakest of the three available
# predictors (Spearman rho +0.48 against the measured bias, versus -0.82 for
# the droplet-crossing count and -0.77 for the mean electron energy) because
# it misses soft beta emitters such as H-3 and Pu-241 entirely.
micCorrECThreshold = 0.01
# mean DIAMETER of the reverse micelles in nm. The stochastic kernel uses half
# of it as the droplet radius; the legacy micelleLoss() lookup needs one of the
# tabulated diameters 0.5, 1, 2, 3, 4, 5, 6, 7, 8, 10 nm. The 4 nm default
# follows the dynamic light scattering of [D.E. Bergeron, Appl. Radiat. Isot. 70
# (2012) 2164-2169], which found commercial cocktails well below the 8 nm long
# treated as canonical.
diam_micelle = 4
# standard deviation of the micelle size distribution in nm. 0 = monodisperse,
# the default: the size spread measured for commercial LS cocktails is small
# compared with the mean [D.E. Bergeron, Appl. Radiat. Isot. 70 (2012) 2164-2169,
# doi:10.1016/j.apradiso.2012.02.089], so the mean size carries the physics.
# A non-zero value acts only below ~0.3 keV, where it RAISES the retention
# (the escape probability is convex in the radius) -- see
# notebooks/physics/micelleEffects.ipynb, section 5.
sigma_micelle = 0

## OPTICAL PROPERTIES
# Quantum efficiency of PMT A, B, C
effQuantum = 0.25, 0.25, 0.25
# Enable full optical Monte-Carlo transport (opticalTransport=True) instead of
# the semi-analytical detection model. When True, photon emission, isotropic
# propagation (equal splitting [1/3,1/3,1/3] for TDCR, [1/2,1/2] for C/N),
# and photoelectron conversion are all sampled stochastically.
opticalTransport = False

## PROPERTIES OF THE COUNTER
# Coincidence resolving time (ns)
tau = 50
# Extended dead time (µs)
extDT = 30
# Measurement time (minutes)
measTime = 60

## INTERPOLATION TO ESTIMATE THE QUENCHED ENERGY
# depth (number of indexes on each side of the energy point) on which the spline interpolation is done.
depthSpline = 5
# energy (in keV) above which interpolation is applied.
Einterp_a = 100
Einterp_e = 1.5
